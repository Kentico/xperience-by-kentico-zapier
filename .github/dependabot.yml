# Dependabot alerts and security updates are enabled for every repository by the organization's
# security configuration. This file adds weekly version updates and splits both kinds of pull requests
# into major and minor or patch groups.
# Options: https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # The integration targets the oldest supported Xperience by Kentico version on purpose. Raising it
      # forces customers to upgrade, so it is a release decision. Ignore rules apply to security updates too.
      - dependency-name: "Kentico.Xperience.*"
    groups:
      nuget-security-major:
        applies-to: security-updates
        update-types: [major]
      nuget-security-minor-patch:
        applies-to: security-updates
        update-types: [minor, patch]
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /src/XbKcli
      - /tests/Playwright
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm-security-major:
        applies-to: security-updates
        update-types: [major]
      npm-security-minor-patch:
        applies-to: security-updates
        update-types: [minor, patch]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
