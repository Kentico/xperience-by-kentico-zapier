name: "E2E: Build and Test"

on:
  # Not run on pull requests: it needs the license secret, which Dependabot and fork pull requests cannot read.
  # Weekly: newest Xperience release (XbyKVersion=*), drift detection; opens an issue on failure.
  schedule:
    - cron: '0 10 * * 5'  # Runs every Friday at 10:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Xperience version to test against"
        type: choice
        default: latest
        options: [minimal, latest]

jobs:
  build_and_test:
    name: Test E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    env:
      # schedule -> latest, workflow_dispatch -> chosen input
      E2E_TARGET: ${{ inputs.target || 'latest' }}
      ASPNETCORE_ENVIRONMENT: CI
      DATABASE_BACKUP_FILENAME: ""
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      ASPNETCORE_URLS: https://localhost:14070
      DATABASE_PASSWORD: "Pass@12345"
      XPERIENCE_BY_KENTICO_LICENSE: ${{ secrets.XPERIENCE_BY_KENTICO_LICENSE }}

    steps:
      - uses: actions/checkout@v4

      # Fail early with a clear message instead of a 180 s startup timeout later.
      - name: Check license secret
        run: |
          if ([string]::IsNullOrEmpty($env:XPERIENCE_BY_KENTICO_LICENSE)) {
            Write-Host "::error::The XPERIENCE_BY_KENTICO_LICENSE repository secret is not set."
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Playwright 1.63 needs Node >= 20. The Zapier app itself runs on the Zapier runtime of its
          # zapier-platform-core major (Node 18 below core 18.0.0); ci.yml unit-tests it on that version.
          node-version: 22

      - name: Install NPM
        run: |
          cd tests/Playwright
          npm ci
          npx playwright install --with-deps
          cd ../..
          cd src/XbKcli
          npm ci
          cd ../..

      - name: Get Database Backup Name
        run: |
          $latestBackup = Get-Content -Path "./database/backups.txt" -TotalCount 1
          "DATABASE_BACKUP_FILENAME=$latestBackup" >> $env:GITHUB_ENV

      - name: Extract Database Backup
        run: |
          Expand-Archive `
            -Path "./database/${{ env.DATABASE_BACKUP_FILENAME }}.zip" `
            -DestinationPath "./database"

      - name: Install a SQL Server suite of tools (SQLEngine, SQLPackage)
        uses: potatoqualitee/mssqlsuite@605af2310e2e22978ebf2c74d5995ba102094b8a # set as a commit hash for security - v1.8
        with:
          install: sqlpackage, sqlengine, sqlclient
          sa-password: ${{ env.DATABASE_PASSWORD }}
          version: 2022

      - name: Copy database backup into the SQL Server container
        run: |
          docker exec sql mkdir -p /var/opt/mssql/backup
          docker cp "./database/${{ env.DATABASE_BACKUP_FILENAME }}" sql:/var/opt/mssql/backup

      # Same script developers run locally (see docs/Contributing-Setup.md):
      # restore -> license -> seed -> upgrade to LastAppliedHotfix + CI restore -> rebuild with XbyKVersion=*
      # -> upgrade again -> API key -> start app -> Playwright -> Zapier contract tests -> stop app -> drop database
      - name: Run E2E (${{ env.E2E_TARGET }})
        run: |
          cd scripts
          ./Invoke-E2E.ps1 `
            -Target $env:E2E_TARGET `
            -BackupPath "/var/opt/mssql/backup/$($env:DATABASE_BACKUP_FILENAME)" `
            -Url $env:ASPNETCORE_URLS

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./tests/Playwright/playwright-report/
          retention-days: 30  
      
      # Create an issue if this job fails
      - name: "Create GitHub Issue on Failure"
        if: ${{ failure() && github.event_name == 'schedule' }} # Only the weekly drift run opens issues; manual runs report in the run itself
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date();
            const issueTitle = `🚨 ${date.toLocaleDateString('en-GB')} E2E Test Failed: Weekly Cron Job`;
            const issueBody = `### Workflow Failure Alert
            - **Repository**: ${{ github.repository }}
            - **Workflow**: [Test E2E](https://github.com/Kentico/xperience-by-kentico-zapier/actions/runs/${{ github.run_id }})
            - **Timestamp**: ${date.toISOString()}

            Please check the logs and resolve the issue.`;

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ["workflow-failure"]
              });
            } catch (error) {
              console.error("Error creating issue:", error);
            }